# Tokyo Night Storm.
#
# Self-contained on purpose -- see the note in rose-pine-dawn/alacritty.toml. This
# used to import the upstream port from ~/.config/alacritty/themes, so the theme was
# broken on any machine without that repo cloned.
#
# One change from the upstream port: ANSI 0 ships as #32344a, only 1.20:1 against
# the background and so effectively invisible. TUIs draw bullets, box-drawing and
# dim text with ANSI 0, so those glyphs vanish. Raised to Storm's own comment and
# dark5 greys -- canonical palette, actually legible.

[colors.primary]
background = '#24283b'
foreground = '#a9b1d6'

[colors.normal]
black   = '#565f89'   # comment  2.35:1  (upstream #32344a = 1.20:1)
red     = '#f7768e'
green   = '#9ece6a'
yellow  = '#e0af68'
blue    = '#7aa2f7'
magenta = '#ad8ee6'
cyan    = '#449dab'
white   = '#9699a8'

[colors.bright]
black   = '#737aa2'   # dark5    3.60:1
red     = '#ff7a93'
green   = '#b9f27c'
yellow  = '#ff9e64'
blue    = '#7da6ff'
magenta = '#bb9af7'
cyan    = '#0db9d7'
white   = '#acb0d0'
