# Rosé Pine Dawn -- roles, not palette names. See config/alacritty/light.toml.
#   canvas #f2e9e1 · raised #dfdad9 · selected #cecacd · accent #286983 (pine)
# The status bar is chrome, so it sits on `raised` -- a step DOWN from the canvas,
# never up toward white. gold is darkened to #bf7614 to clear 3:1 as text.
set -g status-style "fg=#575279,bg=#dfdad9"
set -g status-left "#[fg=#286983,bg=#dfdad9,bold] #S #[default]"
set -g status-right "#[fg=#53909a,bg=#dfdad9] %Y-%m-%d #[fg=#bf7614,bg=#dfdad9] %H:%M #[default]"
setw -g window-status-current-format "#[fg=#f2e9e1,bg=#286983,bold] #I:#W #[default]"
setw -g window-status-format "#[fg=#797593,bg=#cecacd] #I:#W #[default]"
set -g pane-border-style "fg=#cecacd"
set -g pane-active-border-style "fg=#286983"
