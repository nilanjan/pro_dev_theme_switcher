<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="ProDev Theme Switcher">
  <title>ProDev Theme Switcher</title>
  <!-- Same geometry as logo.svg, reduced to one colour: blades solid, opening and
       seams knocked out, so it survives being tinted as a template image. -->
  <defs>
    <mask id="blades">
      <circle cx="256" cy="256" r="152" fill="#fff"/>
      <polygon points="256.0,198.0 306.2,227.0 306.2,285.0 256.0,314.0 205.8,285.0 205.8,227.0" fill="#000"/>
      <g stroke="#000" stroke-width="17" stroke-linecap="round">
    <line x1="256.0" y1="198.0" x2="344.3" y2="132.3"/>
    <line x1="306.2" y1="227.0" x2="407.3" y2="270.6"/>
    <line x1="306.2" y1="285.0" x2="319.0" y2="394.3"/>
    <line x1="256.0" y1="314.0" x2="167.7" y2="379.7"/>
    <line x1="205.8" y1="285.0" x2="104.7" y2="241.4"/>
    <line x1="205.8" y1="227.0" x2="193.0" y2="117.7"/>
      </g>
    </mask>
  </defs>
  <rect x="0" y="0" width="512" height="512" fill="currentColor" mask="url(#blades)"/>
</svg>
