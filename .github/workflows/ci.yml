name: CI

# macOS only by design: the app is a menu bar item that drives the system
# appearance, so there is nothing to build or test on another platform.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, test, gate
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build -c release

      - name: Unit tests
        run: swift run core-tests

      # The core is pure Foundation and must stay fully covered. main.swift is
      # excluded because it cannot be: NSStatusItem, AppleScript and the SkyLight
      # dlsym calls all need a window server, which no runner has.
      - name: Coverage (ThemeSwitcherCore must be 100% of lines)
        run: |
          swift build --enable-code-coverage --product core-tests
          BIN=$(swift build --enable-code-coverage --product core-tests --show-bin-path)
          LLVM_PROFILE_FILE="$BIN/core.profraw" "$BIN/core-tests"
          xcrun llvm-profdata merge -sparse "$BIN/core.profraw" -o "$BIN/core.profdata"
          xcrun llvm-cov report "$BIN/core-tests" \
            -instr-profile "$BIN/core.profdata" \
            Sources/ThemeSwitcherCore/Core.swift | tee coverage.txt
          PCT=$(awk '/Core.swift/ {gsub("%","",$(NF-3)); print $(NF-3)}' coverage.txt)
          echo "line coverage: $PCT%"
          awk -v p="$PCT" 'BEGIN { if (p+0 < 100) { print "::error::line coverage " p "% < 100%"; exit 1 } }'

      - name: Sync script tests
        run: ./tests/sync_test.sh

      - name: Palette gate
        run: python3 tests/palette_gate.py

      # Smoke test: build the real bundle and drive the CLI end to end. The runner
      # has no menu bar, so this asserts the app launches, applies a theme and
      # rewrites the target configs -- not that anything is drawn.
      - name: Smoke test
        run: |
          set -uo pipefail
          make app
          BIN="$GITHUB_WORKSPACE/dist/ProDev Theme Switcher.app/Contents/MacOS/prodev-theme-switcher"
          test -x "$BIN" || { echo "::error::binary missing"; exit 1; }
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' \
            "dist/ProDev Theme Switcher.app/Contents/Info.plist"
          codesign --verify --verbose "dist/ProDev Theme Switcher.app"

          # Scratch HOME so the runner's own config is untouched. macos is skipped:
          # flipping the system appearance needs a window server.
          export HOME="$RUNNER_TEMP/smoke"
          rm -rf "$HOME"
          # A target counts as installed only if its config is present -- so the
          # fixture has to look like a machine that actually has these tools.
          mkdir -p "$HOME/.claude" "$HOME/.config/herdr" "$HOME/.config/alacritty" "$HOME/.tmux"
          printf '{\n  "theme": "auto"\n}\n' > "$HOME/.claude/settings.json"
          printf '[theme]\nname = "placeholder"\n\n[ui]\n' > "$HOME/.config/herdr/config.toml"
          make install-config

          fail=0
          check() {  # name, pattern, file
            if [ ! -f "$3" ]; then
              echo "::error::$1 -- $3 was never written"; fail=1; return
            fi
            if grep -q "$2" "$3"; then
              echo "  ok  $1"
            else
              echo "::error::$1 -- $3 does not contain '$2'"
              echo "        actual: $(head -c 300 "$3" | tr '\n' ' ')"
              fail=1
            fi
          }

          for mode in light dark; do
            echo "== --set $mode =="
            PDTS_SKIP=macos "$BIN" --set "$mode"
            echo "  exit=$?"
            [ "$mode" = light ] && slug=rose-pine-dawn nv=rose-pine-dawn \
                                || slug=tokyo-night-storm nv=tokyonight-storm
            check "claude theme"  "custom:$slug" "$HOME/.claude/settings.json"
            check "nvim state"    "$nv"          "$HOME/.local/share/nvim/theme_state.txt"
            check "zsh mode"      "$mode"        "$HOME/.zsh_theme_mode"
            check "herdr theme"   "$slug"        "$HOME/.config/herdr/config.toml"
            check "alacritty"     "colors"       "$HOME/.config/alacritty/themes/custom/$mode.toml"
            check "tmux"          "status"       "$HOME/.tmux/themes/$mode.conf"
          done

          # And the other half of the contract: a tool that is NOT installed must be
          # left entirely alone, not have config invented for it.
          echo "== uninstalled tools are skipped =="
          export HOME="$RUNNER_TEMP/bare"
          rm -rf "$HOME"; mkdir -p "$HOME"
          make install-config >/dev/null
          "$BIN" --set light
          if [ -e "$HOME/.config/herdr" ] || [ -e "$HOME/.claude/settings.json" ]; then
            echo "::error::wrote config for a tool that is not installed"
            find "$HOME" -type f | head -20
            fail=1
          else
            echo "  ok  no config invented for absent tools"
          fi

          if [ "$fail" -ne 0 ]; then
            echo "--- scratch HOME contents, for diagnosis ---"
            find "$HOME" -type f | head -40
            exit 1
          fi
          echo "smoke: light and dark both applied"

      - name: Theme JSON is valid and complete
        run: python3 tests/theme_json_test.py
