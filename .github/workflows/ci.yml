name: CI

# macOS only by design: the app is a menu bar item that drives the system
# appearance, so there is nothing to build or test on another platform.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, test, gate
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build -c release

      - name: Unit tests
        run: swift run core-tests

      # The core is pure Foundation and must stay fully covered. main.swift is
      # excluded because it cannot be: NSStatusItem, AppleScript and the SkyLight
      # dlsym calls all need a window server, which no runner has.
      - name: Coverage (ThemeSwitcherCore must be 100% of lines)
        run: |
          swift build --enable-code-coverage --product core-tests
          BIN=$(swift build --enable-code-coverage --product core-tests --show-bin-path)
          LLVM_PROFILE_FILE="$BIN/core.profraw" "$BIN/core-tests"
          xcrun llvm-profdata merge -sparse "$BIN/core.profraw" -o "$BIN/core.profdata"
          xcrun llvm-cov report "$BIN/core-tests" \
            -instr-profile "$BIN/core.profdata" \
            Sources/ThemeSwitcherCore/Core.swift | tee coverage.txt
          PCT=$(awk '/Core.swift/ {gsub("%","",$(NF-3)); print $(NF-3)}' coverage.txt)
          echo "line coverage: $PCT%"
          awk -v p="$PCT" 'BEGIN { if (p+0 < 100) { print "::error::line coverage " p "% < 100%"; exit 1 } }'

      # Two targets are cheap enough to run for real: the sync tests start a tmux
      # server on the sandbox conf and read the style back, and load the edited
      # init.lua in a headless Neovim. Those are the checks that would have caught
      # the first release writing files nothing read.
      - name: tmux and Neovim, for the real-consumer checks
        run: brew install tmux neovim

      - name: Sync script tests
        run: ./tests/sync_test.sh

      - name: Palette gate
        run: python3 tests/palette_gate.py

      # Smoke test: build the real bundle and drive the CLI end to end. The runner
      # has no menu bar, so this asserts the app launches, applies a theme and
      # rewrites the target configs -- not that anything is drawn.
      - name: Smoke test
        run: |
          set -uo pipefail
          make app
          BIN="$GITHUB_WORKSPACE/dist/ProDev Theme Switcher.app/Contents/MacOS/prodev-theme-switcher"
          test -x "$BIN" || { echo "::error::binary missing"; exit 1; }
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' \
            "dist/ProDev Theme Switcher.app/Contents/Info.plist"
          codesign --verify --verbose "dist/ProDev Theme Switcher.app"

          # Scratch HOME so the runner's own config is untouched. macos is skipped:
          # flipping the system appearance needs a window server.
          export HOME="$RUNNER_TEMP/smoke"
          export TMUX_TMPDIR="$HOME"
          rm -rf "$HOME"
          # A fresh machine that has the tools: bare configs, none of the hooks the
          # author's dotfiles happen to have, no [theme] table, no "theme" key.
          # Nothing is pre-installed under HOME either -- the bundle has to lay down
          # its own sync.sh and themes on first run.
          mkdir -p "$HOME/.claude" "$HOME/.config/herdr" "$HOME/.config/alacritty" "$HOME/.config/nvim" "$HOME/.config/opencode"
          printf '{\n  "permissions": {}\n}\n'  > "$HOME/.claude/settings.json"
          printf '[ui]\nconfirm_close = true\n' > "$HOME/.config/herdr/config.toml"
          printf '[font]\nsize = 13\n'          > "$HOME/.config/alacritty/alacritty.toml"
          printf 'set -g mouse on\n'            > "$HOME/.tmux.conf"
          printf 'vim.o.number = true\n'        > "$HOME/.config/nvim/init.lua"

          fail=0
          check() {  # name, pattern, file
            if [ ! -f "$3" ]; then
              echo "::error::$1 -- $3 was never written"; fail=1; return
            fi
            if grep -q "$2" "$3"; then
              echo "  ok  $1"
            else
              echo "::error::$1 -- $3 does not contain '$2'"
              echo "        actual: $(head -c 300 "$3" | tr '\n' ' ')"
              fail=1
            fi
          }

          for mode in light dark; do
            echo "== --set $mode =="
            PDTS_SKIP=macos "$BIN" --set "$mode"
            echo "  exit=$?"
            [ "$mode" = light ] && slug=rose-pine-dawn nv=rose-pine-dawn bg='#f2e9e1' \
                                || slug=tokyo-night-storm nv=tokyonight-storm bg='#24283b'
            check "self-installed"  "apply_mode"    "$HOME/.config/prodev-theme-switcher/sync.sh"
            check "claude theme"    "custom:prodev-theme-switcher" "$HOME/.claude/settings.json"
            check "claude file"     "$bg"           "$HOME/.claude/themes/prodev-theme-switcher.json"
            check "opencode theme"  "prodev-theme-switcher" "$HOME/.config/opencode/tui.json"
            check "opencode file"   "$bg"           "$HOME/.config/opencode/themes/prodev-theme-switcher.json"
            check "nvim state"      "$nv"           "$HOME/.local/share/nvim/theme_state.txt"
            check "nvim wired"      "prodev_theme"  "$HOME/.config/nvim/init.lua"
            check "nvim module"     "colorscheme"   "$HOME/.config/nvim/lua/prodev_theme.lua"
            check "zsh mode"        "$mode"         "$HOME/.zsh_theme_mode"
            check "herdr theme"     "$slug"         "$HOME/.config/herdr/config.toml"
            check "herdr [theme]"   '^\[theme\]'    "$HOME/.config/herdr/config.toml"
            check "alacritty wired" "current.toml"  "$HOME/.config/alacritty/alacritty.toml"
            check "alacritty theme" "$bg"           "$HOME/.config/alacritty/themes/custom/current.toml"
            check "tmux wired"      "current.conf"  "$HOME/.tmux.conf"
            check "tmux theme"      "$bg"           "$HOME/.tmux/themes/current.conf"
            check "backup taken"    "size = 13"     "$HOME/.config/prodev-theme-switcher/backup/original/.config/alacritty/alacritty.toml"
          done

          # A real tmux, started on the edited conf, must be showing the dark theme.
          # (short socket path: unix sockets cap out around 100 characters)
          sock=$(mktemp -u /tmp/pdts-tmux.XXXXXX)
          tmux -S "$sock" -f "$HOME/.tmux.conf" new-session -d
          style=$(tmux -S "$sock" show -gv status-style)
          tmux -S "$sock" kill-server
          if [ "$style" = "fg=#c0caf5,bg=#24283b" ]; then echo "  ok  a real tmux applied the theme"
          else echo "::error::tmux status-style is '$style'"; fail=1; fi

          # And the other half of the contract: a tool that is NOT installed must be
          # left entirely alone, not have config invented for it.
          echo "== uninstalled tools are skipped =="
          export HOME="$RUNNER_TEMP/bare"
          rm -rf "$HOME"; mkdir -p "$HOME"
          "$BIN" --set light
          if [ -e "$HOME/.config/herdr" ] || [ -e "$HOME/.claude" ] || [ -e "$HOME/.tmux.conf" ] \
             || [ -e "$HOME/.config/alacritty" ] || [ -e "$HOME/.config/nvim" ] \
             || [ -e "$HOME/.config/opencode" ]; then
            echo "::error::wrote config for a tool that is not installed"
            find "$HOME" -type f | head -20
            fail=1
          else
            echo "  ok  no config invented for absent tools"
          fi

          if [ "$fail" -ne 0 ]; then
            echo "--- scratch HOME contents, for diagnosis ---"
            find "$HOME" -type f | head -40
            exit 1
          fi
          echo "smoke: light and dark both applied"

      - name: Theme JSON is valid and complete
        run: python3 tests/theme_json_test.py
